<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Resultados</title>
</head>
<body>
    <h1>Consulta de Resultados de Exámenes</h1>
    <form id="consultaForm">
        <label for="rut">RUT:</label>
        <input type="text" id="rut" name="rut" required><br><br>

        <label for="fecha_nacimiento">Fecha de Nacimiento:</label>
        <input type="text" id="fecha_nacimiento" name="fecha_nacimiento" required><br><br>

        <label for="fecha_atencion">Fecha de Atención:</label>
        <input type="text" id="fecha_atencion" name="fecha_atencion" required><br><br>

        <button type="submit">Consultar</button>
    </form>

    <div id="resultados"></div>

    <script>
        document.getElementById('consultaForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            try {
                const response = await fetch('/api/consultar', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                document.getElementById('resultados').innerText = JSON.stringify(result, null, 2);
            } catch (error) {
                document.getElementById('resultados').innerText = 'Error: ' + error.message;
            }
        });
    </script>
</body>
</html>
